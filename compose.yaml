name: leadflow-local

x-backend: &backend
  build: ./backend
  image: leadflow-local-backend
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.local
  volumes:
    - ./backend:/app
  depends_on:
    postgres:
      condition: service_healthy
  init: true

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/init_local_env.py first}
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/init_local_env.py first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_local_env.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  bot:
    <<: *backend
    profiles: [bot]
    command: ["python", "manage.py", "runbot"]
    stop_grace_period: 30s

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [api]
    init: true

volumes:
  postgres_data:
  frontend_node_modules:
